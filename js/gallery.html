<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <title>Output · Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      --glass: rgba(28, 28, 30, 0.72);
      --hairline: rgba(255, 255, 255, 0.14);
      --label: rgba(235, 235, 245, 0.6);
      --blue: #0a84ff;
      --green: #30d158;
      --red: #ff453a;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #f2f2f7;
      font: 15px/1.3 var(--font);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    button {
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    #pane {
      --nav-h: calc(44px + env(safe-area-inset-top, 0px));
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scrollbar-width: none;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #pane::-webkit-scrollbar { display: none; }
    #ptr {
      height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--label);
      font: 600 13px/1 var(--font);
      letter-spacing: -0.01em;
    }
    #ptr.busy { height: 44px; color: #f2f2f7; }
    #ptr.busy::before {
      content: "";
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-top-color: #fff;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #nav {
      position: sticky;
      top: 0;
      z-index: 6;
      display: grid;
      grid-template-columns: minmax(44px, 1fr) auto minmax(44px, 1fr);
      align-items: center;
      column-gap: 8px;
      min-height: calc(44px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 8px 0;
      background: transparent;
    }
    #nav.material {
      background: var(--glass);
      -webkit-backdrop-filter: saturate(200%) blur(28px);
      backdrop-filter: saturate(200%) blur(28px);
    }
    .nav-side { display: flex; min-width: 44px; min-height: 44px; align-items: center; }
    .nav-side.left { justify-content: flex-start; }
    .nav-side.right { justify-content: flex-end; }
    #back {
      display: flex;
      align-items: center;
      gap: 1px;
      max-width: 42vw;
      min-height: 44px;
      margin: 0;
      padding: 0 8px 0 4px;
      border: 0;
      background: transparent;
      color: var(--blue);
      font: 600 17px/1 var(--font);
      letter-spacing: -0.02em;
    }
    #back[hidden] { display: none; }
    #back svg { flex: 0 0 auto; }
    #back span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #back:active { opacity: 0.55; }
    #navtitle {
      max-width: 46vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      font: 600 17px/1.1 var(--font);
      letter-spacing: -0.02em;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }
    #navtitle.show { opacity: 1; transform: none; }
    #refresh {
      position: relative;
      width: 44px;
      height: 44px;
      margin-right: 4px;
      padding: 0;
      border-radius: 22px;
      border: 0.5px solid rgba(255, 255, 255, 0.18);
      background: rgba(118, 118, 128, 0.28);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      backdrop-filter: saturate(180%) blur(16px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #refresh:active { transform: scale(0.96); }
    #refresh.hot::after {
      content: "";
      position: absolute;
      top: 7px;
      right: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45);
    }
    .hero { padding: 0 16px 6px; }
    #title {
      margin: 0;
      font: 700 34px/1.08 var(--display);
      letter-spacing: 0.013em;
      overflow-wrap: anywhere;
    }
    #sub {
      margin: 3px 0 0;
      color: var(--label);
      font: 400 15px/1.25 var(--font);
      letter-spacing: -0.01em;
    }
    #status {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--green);
      font: 600 15px/1.2 var(--font);
      letter-spacing: -0.01em;
    }
    #status.err { color: var(--red); }
    #status[hidden] { display: none !important; }
    .segwrap {
      position: sticky;
      top: var(--nav-h);
      z-index: 5;
      padding: 2px 16px 12px;
      background: transparent;
    }
    .segwrap.material {
      background: var(--glass);
      -webkit-backdrop-filter: saturate(200%) blur(28px);
      backdrop-filter: saturate(200%) blur(28px);
      border-bottom: 0.5px solid var(--hairline);
      box-shadow: 0 -8px 0 var(--glass);
    }
    .seg {
      display: flex;
      padding: 2px;
      border-radius: 10px;
      background: rgba(118, 118, 128, 0.24);
    }
    .seg button {
      flex: 1;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font: 600 13px/1 var(--font);
      letter-spacing: -0.02em;
    }
    .seg button.on {
      background: rgba(99, 99, 102, 0.92);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28), inset 0 0.5px 0 rgba(255, 255, 255, 0.12);
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: #000;
    }
    @media (min-width: 680px) {
      #grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .tile {
      position: relative;
      display: block;
      width: 100%;
      min-width: 0;
      aspect-ratio: 1;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border: 0;
      background: #1c1c1e;
      color: #f2f2f7;
      -webkit-touch-callout: none;
    }
    .tile:active { opacity: 0.72; }
    .tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #1c1c1e;
    }
    .tile img:not([src]) { display: none; }
    .tile.vid {
      background:
        radial-gradient(120% 90% at 30% 18%, #3a3a3c 0%, #121214 68%);
    }
    .badge {
      position: absolute;
      z-index: 1;
      left: 6px;
      bottom: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .badge svg { display: block; margin-left: 2px; }
    .tile.folder:not(.has-preview) {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background:
        radial-gradient(120% 80% at 50% 28%, rgba(255, 255, 255, 0.07), transparent 58%),
        #1c1c1e;
      box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.08);
    }
    .tile.folder .glyph {
      display: flex;
      color: rgba(235, 235, 245, 0.55);
    }
    .tile.folder img { display: none; }
    .tile.folder.has-preview img { display: block; }
    .tile.folder.has-preview .glyph { display: none; }
    .tile.folder .name {
      position: relative;
      z-index: 1;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      font: 600 11px/1.2 var(--font);
      letter-spacing: -0.01em;
    }
    .tile.folder.has-preview .name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: none;
      padding: 18px 6px 6px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0));
    }
    .hint {
      grid-column: 1 / -1;
      margin: 0;
      padding: 72px 28px;
      text-align: center;
      color: #f2f2f7;
      font: 600 20px/1.25 var(--display);
      letter-spacing: 0.01em;
    }
    .hint small {
      display: block;
      margin-top: 6px;
      color: var(--label);
      font: 400 15px/1.35 var(--font);
    }
    #sentinel { height: 1px; }
    #full {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      touch-action: none;
    }
    #full.open { display: block; }
    #stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      transform-origin: center center;
    }
    #stage img, #stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
      -webkit-user-drag: none;
      -webkit-touch-callout: default;
      -webkit-user-select: auto;
      user-select: auto;
    }
    #full.video #stage video {
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      left: env(safe-area-inset-left, 0px);
    }
    #chrome {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    #chrome::before,
    #chrome::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
    }
    #chrome::before {
      top: 0;
      height: calc(96px + env(safe-area-inset-top, 0px));
      background: linear-gradient(rgba(0, 0, 0, 0.45), transparent);
    }
    #chrome::after {
      bottom: 0;
      height: calc(84px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.45));
    }
    #chrome button { pointer-events: auto; }
    #full.bare #chrome { opacity: 0; }
    #full.bare #chrome button { pointer-events: none; }
    #close, #save, #prev, #next {
      position: absolute;
      border: 0.5px solid rgba(255, 255, 255, 0.18);
      background: rgba(28, 28, 30, 0.55);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      color: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    #close, #save { top: calc(10px + env(safe-area-inset-top, 0px)); }
    #close {
      left: max(12px, env(safe-area-inset-left, 0px));
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #save {
      right: max(12px, env(safe-area-inset-right, 0px));
      min-height: 44px;
      padding: 0 16px 0 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      font: 600 15px/1 var(--font);
      letter-spacing: -0.02em;
    }
    #close:active, #save:active { transform: scale(0.96); }
    #prev, #next {
      display: none;
      top: 50%;
      width: 44px;
      height: 44px;
      margin-top: -22px;
      padding: 0;
      border-radius: 22px;
      align-items: center;
      justify-content: center;
    }
    #prev { left: max(12px, env(safe-area-inset-left, 0px)); }
    #next { right: max(12px, env(safe-area-inset-right, 0px)); }
    @media (min-width: 800px) and (pointer: fine) {
      #prev, #next { display: flex; }
    }
    #count {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.86);
      font: 600 13px/1 var(--font);
      letter-spacing: -0.01em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
      pointer-events: none;
      white-space: nowrap;
    }
    @media (prefers-reduced-motion: reduce) {
      #stage, #chrome, #navtitle, #ptr.busy::before { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="pane">
    <div id="ptr">Pull to refresh</div>
    <header id="nav">
      <div class="nav-side left">
        <button type="button" id="back" hidden>
          <svg viewBox="0 0 12 20" width="11" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>
          <span id="backlabel">Output</span>
        </button>
      </div>
      <div id="navtitle">Output</div>
      <div class="nav-side right">
        <button type="button" id="refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5"/><path d="M20 4v5h-5"/></svg>
        </button>
      </div>
    </header>
    <div class="hero">
      <h1 id="title">Output</h1>
      <p id="sub">Loading…</p>
      <button type="button" id="status" hidden>New Photos</button>
    </div>
    <div class="segwrap">
      <div class="seg" role="tablist" aria-label="Albums">
        <button type="button" data-kind="output" class="on" role="tab" aria-selected="true">Output</button>
        <button type="button" data-kind="input" role="tab" aria-selected="false">Input</button>
        <button type="button" data-kind="temp" role="tab" aria-selected="false">Temp</button>
      </div>
    </div>
    <div id="grid"></div>
    <div id="sentinel"></div>
  </div>
  <div id="full" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Photo">
    <div id="stage">
      <img alt="" decoding="async" draggable="false">
      <video controls playsinline hidden></video>
    </div>
    <div id="chrome">
      <button type="button" id="close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button type="button" id="save" aria-label="Share or save">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 8 5-5 5 5"/><path d="M6 12v7a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-7"/></svg>
        Share
      </button>
      <button type="button" id="prev" aria-label="Previous">‹</button>
      <button type="button" id="next" aria-label="Next">›</button>
      <div id="count"></div>
    </div>
  </div>
  <script>
    const MEDIA_OK = /\.(png|jpe?g|webp|gif|bmp|tiff?|avif|jfif|mp4|webm|mov|mkv)$/i;
    const VIDEO_OK = /\.(mp4|webm|mov|mkv)$/i;
    const KIND_NAME = { output: "Output", input: "Input", temp: "Temp" };
    const FIRST = 24;
    const MORE = 15;
    const THUMB_SLOTS = 2;
    const FOLDER_SVG = '<svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><path fill="currentColor" d="M8 15.2c0-2.3 1.8-4.2 4.1-4.2h8c1.1 0 2.1.4 2.8 1.2l1.8 1.9H36c2.2 0 4 1.8 4 4.1V33c0 2.3-1.8 4.2-4.1 4.2H12.1C9.8 37.2 8 35.3 8 33V15.2z"/></svg>';
    const PLAY_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="#1c1c1e" d="M9 6.6v10.8l9.4-5.4L9 6.6z"/></svg>';
    const THUMB = (function () {
      const cols = window.matchMedia("(min-width: 680px)").matches ? 4 : 3;
      const css = Math.max(120, Math.ceil(window.innerWidth / cols));
      return String(Math.min(640, Math.max(128, Math.round(css * (window.devicePixelRatio || 1)))));
    })();

    let kind = "output";
    let path = "";
    let viewKey = "";
    let folders = [];
    let items = [];
    let shown = 0;
    let idx = 0;
    let newest = "";
    let stamp = 0;
    let req = 0;
    let active = 0;
    let filling = false;
    let moreQueued = false;
    let sliding = false;
    let slideGen = 0;
    let suppressClick = false;
    const q = [];
    const coverCache = new Map();
    let coverCtrl = new AbortController();

    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const back = document.getElementById("back");
    const backLabel = document.getElementById("backlabel");
    const titleEl = document.getElementById("title");
    const navTitle = document.getElementById("navtitle");
    const sub = document.getElementById("sub");
    const refresh = document.getElementById("refresh");
    const nav = document.getElementById("nav");
    const segwrap = document.querySelector(".segwrap");
    const pane = document.getElementById("pane");
    const ptr = document.getElementById("ptr");
    const sentinel = document.getElementById("sentinel");
    const full = document.getElementById("full");
    const stage = document.getElementById("stage");
    const img = full.querySelector("img");
    const vid = full.querySelector("video");
    const countEl = document.getElementById("count");

    function isVid(n) { return VIDEO_OK.test(n || ""); }
    function parentPath(p) {
      const parts = String(p || "").split("/").filter(Boolean);
      parts.pop();
      return parts.join("/");
    }
    function nLabel(n, singular, plural) {
      return n.toLocaleString() + " " + (n === 1 ? singular : plural);
    }
    function currentTitle() {
      if (path) {
        const parts = path.split("/").filter(Boolean);
        return parts[parts.length - 1] || KIND_NAME[kind] || "Gallery";
      }
      return KIND_NAME[kind] || "Gallery";
    }
    function parentTitle() {
      const parts = path.split("/").filter(Boolean);
      parts.pop();
      if (!parts.length) return KIND_NAME[kind] || "Gallery";
      return parts[parts.length - 1];
    }
    function describeCounts() {
      const photos = items.reduce(function (n, it) { return n + (isVid(it.filename) ? 0 : 1); }, 0);
      const videos = items.length - photos;
      const bits = [];
      if (folders.length) bits.push(nLabel(folders.length, "Album", "Albums"));
      if (photos) bits.push(nLabel(photos, "Photo", "Photos"));
      if (videos) bits.push(nLabel(videos, "Video", "Videos"));
      return bits.length ? bits.join(" · ") : "No Photos";
    }
    function syncHeader() {
      const title = currentTitle();
      titleEl.textContent = title;
      navTitle.textContent = title;
      document.title = title + " · Gallery";
      if (path) {
        back.hidden = false;
        backLabel.textContent = parentTitle();
      } else {
        back.hidden = true;
      }
      sub.textContent = describeCounts();
    }
    function originalUrl(it) {
      const p = new URLSearchParams({
        filename: it.filename,
        type: it.type || kind,
        subfolder: it.subfolder || "",
      });
      return "/view?" + p.toString();
    }
    function url(it, mode) {
      const p = new URLSearchParams({
        filename: it.filename,
        type: it.type || kind,
        subfolder: it.subfolder || "",
      });
      if (isVid(it.filename)) return "/view?" + p.toString();
      if (mode === "full") {
        p.set("size", "640");
        p.set("q", "40");
      } else {
        p.set("size", THUMB);
        p.set("q", "30");
      }
      return "/dgm/thumb?" + p.toString();
    }
    function downloadOriginal(href, filename) {
      const a = document.createElement("a");
      a.href = href;
      a.download = filename || "";
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    // Share/Save sends the original /view file. Never /dgm/thumb.
    function saveCurrent(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const it = items[idx];
      if (!it) return;
      const href = originalUrl(it);
      const canFileShare = typeof navigator.share === "function" && typeof navigator.canShare === "function";
      if (!canFileShare) {
        downloadOriginal(href, it.filename);
        return;
      }
      fetch(href, { credentials: "same-origin" }).then(function (res) {
        if (!res.ok) throw new Error("fetch");
        return res.blob();
      }).then(function (blob) {
        const file = new File([blob], it.filename || "file", { type: blob.type || "application/octet-stream" });
        if (!navigator.canShare({ files: [file] })) {
          downloadOriginal(href, it.filename);
          return;
        }
        return navigator.share({ files: [file], title: it.filename || "" });
      }).catch(function (err) {
        if (err && err.name === "AbortError") return;
        downloadOriginal(href, it.filename);
      });
    }
    function pump() {
      while (active < THUMB_SLOTS && q.length) {
        const el = q.shift();
        if (!el || !el.isConnected) continue;
        const src = el.getAttribute("data-src");
        if (!src) continue;

        const d = Math.max(0, Math.min(84, (dy - 8) * 0.55));
        ptr.style.height = d + "px";
        pull.armed = d >= 54;
        ptr.textContent = pull.armed ? "Release to refresh" : "Pull to refresh";
      }
    }, { passive: false });
    pane.addEventListener("touchend", async function () {
      if (!pull) return;
      const go = pull.armed;
      pull = null;
      if (!go) {
        ptr.style.height = "0px";
        ptr.textContent = "Pull to refresh";
        return;
      }
      ptr.classList.add("busy");
      ptr.style.height = "44px";
      ptr.textContent = "Refreshing…";
      await load(true);
      ptr.classList.remove("busy");
      ptr.style.height = "0px";
      ptr.textContent = "Pull to refresh";
    }, { passive: true });
    pane.addEventListener("touchcancel", resetPtr, { passive: true });

    let scrollTick = false;
    pane.addEventListener("scroll", function () {
      if (scrollTick) return;
      scrollTick = true;
      requestAnimationFrame(function () {
        scrollTick = false;
        updateStick();
      });
    }, { passive: true });
    if (window.ResizeObserver) {
      new ResizeObserver(function () {
        pane.style.setProperty("--nav-h", nav.offsetHeight + "px");
        updateStick();
      }).observe(nav);
    }
    pane.style.setProperty("--nav-h", nav.offsetHeight + "px");
    updateStick();
  </script>
</body>
</html>
